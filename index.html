<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite App</title>

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 🌿 Scrollbar personnalisée Webkit */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #F3F4F6;
      /* Gris clair */
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #25D366, #FF7A00);
      /* Dégradé vert clair à orange tropical */
      border-radius: 10px;
      transition: background 0.3s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #116530, #FF7A00);
      /* Hover : vert foncé */
    }

    /* 🌐 Firefox */
    * {
      scrollbar-width: thin;
      scrollbar-color: #25D366 #F3F4F6;
    }

    /* 🧭 Défilement doux global */
    html {
      scroll-behavior: smooth;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-DSfaewWE.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-QQZCaYCg.css">
</head>

<body class="bg-white text-[#1F2937]">

  <!-- ✅ Barre de progression scroll -->
  <div id="scroll-progress" class="fixed top-0 left-0 h-1 bg-[#25D366] z-50 transition-all duration-300 ease-linear">
  </div>

  <div id="app"></div>

  <!-- Vite App -->

  <!-- Font Awesome Kit -->
  <script src="https://kit.fontawesome.com/your-kit-id.js" crossorigin="anonymous"></script>

  <!-- 🚀 Script pour barre de progression -->
  <script>
    window.addEventListener("scroll", () => {
      const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (scrollTop / scrollHeight) * 100;
      document.getElementById("scroll-progress").style.width = scrolled + "%";
    });
  </script>

</body>

</html>
